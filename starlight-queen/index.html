<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>Starlight Queen — Ana &amp; the Mountain of Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<meta name="description" content="A side-scrolling story. For anyone who waited at eleven for a letter that never came. Ana walks out of a small Finnish town and west across the world, after the Mountain of Light, and towards somebody carrying a lantern.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305060c'/%3E%3Cpath d='M8 1l1.6 4.6L14 8l-4.4 1.4L8 15l-1.6-5.6L2 8l4.4-2.4z' fill='%23bdf4ff'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#05060c;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #game{display:block;background:#000;outline:none}
  #vig{position:absolute;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.38) 100%)}
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  body.touch #touch{display:block}
  .tb{position:absolute;pointer-events:auto;border-radius:50%;width:17vmin;height:17vmin;max-width:92px;max-height:92px;
    background:rgba(14,20,48,.38);border:1px solid rgba(217,181,102,.55);color:rgba(255,243,196,.92);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);
    font:500 6vmin/1 Georgia,serif;display:flex;align-items:center;justify-content:center;transition:transform .08s ease,background .08s ease;
    bottom:calc(5vmin + env(safe-area-inset-bottom))}
  .tb.on{background:rgba(217,181,102,.38);transform:scale(.93)}
  #bL{left:calc(4vmin + env(safe-area-inset-left))}
  #bR{left:calc(24vmin + env(safe-area-inset-left))}
  #bJ{right:calc(4vmin + env(safe-area-inset-right))}
  #bF{right:calc(24vmin + env(safe-area-inset-right));bottom:calc(11vmin + env(safe-area-inset-bottom))}
  .tb.sm{width:13vmin;height:13vmin;max-width:70px;max-height:70px;font-size:5vmin}
  #bS{right:calc(6vmin + env(safe-area-inset-right));bottom:calc(25vmin + env(safe-area-inset-bottom))}
  #bC{right:calc(41vmin + env(safe-area-inset-right));bottom:calc(5vmin + env(safe-area-inset-bottom))}
  #bP{top:calc(22vmin + env(safe-area-inset-top));bottom:auto;right:calc(3vmin + env(safe-area-inset-right));width:13vmin;height:13vmin;min-width:48px;min-height:48px;font-size:4.5vmin;opacity:.65}
  body.menu .tb:not(#bP){display:none}
  body.menu #bP{opacity:.35}
  #turn{display:none;position:fixed;inset:0;background:#05060c;color:#f6e2a0;align-items:center;justify-content:center;text-align:center;font:italic 20px/1.5 "EB Garamond",Georgia,serif;padding:24px;z-index:5}
  @media (orientation:portrait) and (pointer:coarse){#turn{display:flex}}
  noscript{color:#cde;font:16px Georgia,serif;position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Starlight Queen game"></canvas><div id="vig"></div></div>
<div id="touch">
  <div class="tb" id="bL" data-a="left">&#9664;</div>
  <div class="tb" id="bR" data-a="right">&#9654;</div>
  <div class="tb" id="bF" data-a="fire">&#10022;</div>
  <div class="tb" id="bJ" data-a="jump">&#9650;</div>
  <div class="tb sm" id="bS" data-a="light">&#9788;</div>
  <div class="tb sm" id="bC" data-a="down">&#9660;</div>
  <div class="tb" id="bP" data-a="pause"><svg viewBox="0 0 10 10" width="38%" height="38%" aria-hidden="true"><rect x="1.6" y="1" width="2.4" height="8" rx="0.8" fill="currentColor"/><rect x="6" y="1" width="2.4" height="8" rx="0.8" fill="currentColor"/></svg></div>
</div>
<div id="turn">Turn your phone sideways<br>to walk the road west.</div>
<noscript>Starlight Queen needs JavaScript to run.</noscript>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/gems.js"></script>
<script src="js/backdrops.js"></script>
<script src="js/paint.js"></script>
<script src="js/paint-props.js"></script>
<script src="js/paint-life.js"></script>
<script src="js/levels.js"></script>
<script src="js/entities.js"></script>
<script src="js/wonders.js"></script>
<script src="js/world.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
