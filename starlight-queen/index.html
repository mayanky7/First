<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>Starlight Queen — A Tale of the Seven Stars</title>
<meta name="description" content="A classic 2D fantasy platformer. Guide Aelara, Queen of the Silverwood, east across Aurelin to rekindle the beacons and break the Cinder Crown.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305060c'/%3E%3Cpath d='M8 1l1.6 4.6L14 8l-4.4 1.4L8 15l-1.6-5.6L2 8l4.4-2.4z' fill='%23bdf4ff'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#05060c;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;outline:none}
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  body.touch #touch{display:block}
  .tb{position:absolute;pointer-events:auto;border-radius:50%;width:17vmin;height:17vmin;max-width:92px;max-height:92px;
    background:rgba(190,225,255,.10);border:2px solid rgba(200,235,255,.38);color:rgba(225,245,255,.8);
    font:600 7vmin/1 Georgia,serif;display:flex;align-items:center;justify-content:center;
    bottom:calc(5vmin + env(safe-area-inset-bottom))}
  .tb.on{background:rgba(190,225,255,.32)}
  #bL{left:calc(4vmin + env(safe-area-inset-left))}
  #bR{left:calc(24vmin + env(safe-area-inset-left))}
  #bJ{right:calc(4vmin + env(safe-area-inset-right))}
  #bF{right:calc(24vmin + env(safe-area-inset-right));bottom:calc(11vmin + env(safe-area-inset-bottom))}
  #bP{top:calc(2vmin + env(safe-area-inset-top));bottom:auto;left:50%;margin-left:-5vmin;width:10vmin;height:10vmin;font-size:4vmin;opacity:.6}
  noscript{color:#cde;font:16px Georgia,serif;position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Starlight Queen game"></canvas></div>
<div id="touch">
  <div class="tb" id="bL" data-a="left">&#9664;</div>
  <div class="tb" id="bR" data-a="right">&#9654;</div>
  <div class="tb" id="bF" data-a="fire">&#10022;</div>
  <div class="tb" id="bJ" data-a="jump">&#9650;</div>
  <div class="tb" id="bP" data-a="pause">II</div>
</div>
<noscript>Starlight Queen needs JavaScript to run.</noscript>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/backdrops.js"></script>
<script src="js/levels.js"></script>
<script src="js/entities.js"></script>
<script src="js/world.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
