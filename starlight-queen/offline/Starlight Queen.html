<script>
'use strict';
/* Starlight Queen — core: constants, helpers, input */
const W = 384, H = 216, T = 16;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const TAU = Math.PI * 2;

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0;
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}
function mk(w, h) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  return [cv, g];
}
function R(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(x | 0, y | 0, w | 0, h | 0); }
function mix(c1, c2, t) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const r = Math.round(lerp(a >> 16, b >> 16, t)), g = Math.round(lerp(a >> 8 & 255, b >> 8 & 255, t)), bl = Math.round(lerp(a & 255, b & 255, t));
  return '#' + (1 << 24 | r << 16 | g << 8 | bl).toString(16).slice(1);
}

/* ---------- Input ---------- */
const Input = (() => {
  const KEYMAP = {
    KeyA: 'left', KeyD: 'right', KeyW: 'jump', Space: 'jump', KeyZ: 'jump', KeyS: 'down',
    KeyX: 'fire', KeyF: 'fire', ControlLeft: 'fire', KeyE: 'light', KeyC: 'light', ShiftLeft: 'light',
    ArrowLeft: 'left2', ArrowRight: 'right2', ArrowUp: 'jump2', ArrowDown: 'down2',
    KeyK: 'fire2', KeyJ: 'fire2', Slash: 'fire2', KeyL: 'light2', Period: 'light2', ShiftRight: 'light2',
    Enter: 'enter', NumpadEnter: 'enter',
    Escape: 'pause', KeyP: 'pause', KeyM: 'mute', KeyR: 'restart', KeyQ: 'quit', KeyG: 'full', KeyV: 'vault', KeyT: 'travel'
  };
  const MENU_ALIAS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'dn', KeyS: 'dn', Space: 'enter', KeyZ: 'enter', KeyX: 'enter' };
  const held = {}, queued = {}, sources = {};
  let anyQueued = false, onFirst = null, usedTouch = false, tapX = 0, tapY = 0;

  function set(action, src, on) {
    const s = sources[action] || (sources[action] = {});
    if (on) { if (!s[src]) { queued[action] = true; anyQueued = true; } s[src] = true; }
    else delete s[src];
    held[action] = Object.keys(s).length > 0;
  }
  function first() { if (onFirst) { const f = onFirst; onFirst = null; f(); } }

  window.addEventListener('keydown', e => {
    first();
    if ((e.ctrlKey || e.metaKey || e.altKey) && !/^(Control|Shift|Alt|Meta)/.test(e.code)) return;
    const a = KEYMAP[e.code], m = MENU_ALIAS[e.code];
    if (a || m) e.preventDefault();
    if (e.repeat) return;
    if (a) set(a, e.code, true);
    if (m) set(m, e.code, true);
    anyQueued = true;
  });
  window.addEventListener('keyup', e => {
    const a = KEYMAP[e.code], m = MENU_ALIAS[e.code];
    if (a) set(a, e.code, false);
    if (m) set(m, e.code, false);
  });
  window.addEventListener('blur', () => {
    for (const a in sources) { sources[a] = {}; held[a] = false; }
    for (const k in padPrev) delete padPrev[k];
  });

  function bindTouch() {
    const els = document.querySelectorAll('.tb');
    els.forEach(el => {
      const a = el.dataset.a;
      const on = e => { e.preventDefault(); first(); el.classList.add('on'); set(a, 'touch', true); if (a === 'jump') set('enter', 'touchj', true); };
      const off = e => { e.preventDefault(); el.classList.remove('on'); set(a, 'touch', false); if (a === 'jump') set('enter', 'touchj', false); };
      el.addEventListener('pointerdown', on);
      el.addEventListener('pointerup', off);
      el.addEventListener('pointercancel', off);
      el.addEventListener('pointerleave', off);
      el.addEventListener('contextmenu', e => e.preventDefault());
    });
    const cv = document.getElementById('game');
    cv.addEventListener('pointerdown', e => {
      first();
      if (e.pointerType === 'touch' && !usedTouch) { usedTouch = true; document.body.classList.add('touch'); }
      const rc = cv.getBoundingClientRect(); tapX = (e.clientX - rc.left) / rc.width * W; tapY = (e.clientY - rc.top) / rc.height * H;
      set('enter', 'tap', true); set('tap', 'tap', true);
      setTimeout(() => { set('enter', 'tap', false); set('tap', 'tap', false); }, 60);
    });
    if (window.matchMedia && matchMedia('(pointer: coarse)').matches) { usedTouch = true; document.body.classList.add('touch'); }
    // The browser's own zoom has no place in a game: two thumbs on two buttons read as a pinch, quick taps on one as a
    // double-tap, and some browsers (iOS Safari) ignore a page that asks not to be zoomed. So stop those gestures here.
    // And if the page is ever zoomed all the same, step aside, so that a pinch can always bring it back.
    const vv = window.visualViewport, zoomed = () => !!vv && vv.scale > 1.02;
    const stop = e => { if (e.cancelable && !zoomed()) e.preventDefault(); };
    document.addEventListener('touchmove', stop, { passive: false });
    document.addEventListener('touchstart', e => { if (e.touches.length > 1) stop(e); }, { passive: false });
    let lastEnd = 0;
    document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastEnd < 350) stop(e); lastEnd = now; }, { passive: false });
    ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(n => document.addEventListener(n, stop, { passive: false }));
    window.addEventListener('wheel', e => { if (e.ctrlKey) stop(e); }, { passive: false });
    if (vv) {
      const meta = document.querySelector('meta[name="viewport"]'), base = meta && meta.getAttribute('content');
      let tries = 0;
      const check = () => {
        const z = zoomed();
        document.documentElement.classList.toggle('zoomed', z); // the stylesheet lets a pinch through while this is set
        if (!z) { tries = 0; return; }
        if (meta && base && tries < 3) { tries++; meta.setAttribute('content', base + ',minimum-scale=1'); setTimeout(() => meta.setAttribute('content', base), 120); } // asking again for scale 1 snaps some browsers back
      };
      vv.addEventListener('resize', check); window.addEventListener('pageshow', check); window.addEventListener('orientationchange', () => setTimeout(check, 300)); check();
    }
  }

  /* gamepad */
  const padPrev = {}, padSfx = {};
  function pollPad() {
    const pads = (navigator.getGamepads ? Array.from(navigator.getGamepads()) : []).filter(q => q && q.connected);
    pads.slice(0, 2).forEach((p, idx) => {
      const sfx = idx === 1 ? '2' : '';
      if (padSfx[idx] !== sfx) { for (const a in sources) { delete sources[a]['pad' + idx]; held[a] = Object.keys(sources[a]).length > 0; } padPrev[idx] = {}; padSfx[idx] = sfx; }
      const b = i => !!(p.buttons[i] && p.buttons[i].pressed);

  function toggleMute() {

  }
  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    if (document.hidden) ac.suspend();
    else { ac.resume(); if (cur) cur.next = ac.currentTime + 0.1; }
  });

  return { init, sfx, music, setRate, duck, toggleMute, get muted() { return muted; }, get song() { return curName; }, SONGS, compile };
})();

function buildWorld() {
  const rows = ROWS, cols = REGIONS.reduce((a, r) => a + r.cols, 0);
  const grid = [];
  for (let y = 0; y < rows; y++) grid.push(new Array(cols).fill('.'));
  const out = { grid, rows, cols, ents: [], torches: [], start: { x: 40, y: 0 }, arena: null, zones: [], gemBlocks: {}, popN: {}, doors: [], marks: {} };
  const row = a => rows - 1 - a;
  const set = (x, a, ch) => { const r = row(a); if (r >= 0 && r < rows && x >= 0 && x < cols) grid[r][x] = ch; };
  const py = a => (rows - a) * T;
  let ox = 0, shardN = 0;
  REGIONS.forEach((reg, ri) => {
    const px = x => (x + ox) * T + 8, X = x => x + ox;
    const x0 = ox;
    const shard = (x, y) => out.ents.push({ t: 'shard', x, y, n: shardN++ });
    const L = {
      g(a0, a1, h) { for (let x = a0; x <= a1; x++) for (let a = 0; a < h; a++) set(X(x), a, '#'); },
      ceil(a0, a1, th) { for (let x = a0; x <= a1; x++) for (let i = 0; i < th + (reg.roof || 0); i++) grid[i][X(x)] = '#'; },
      liq(a0, a1, h) { for (let x = a0; x <= a1; x++) for (let a = 0; a < h; a++) set(X(x), a, '~'); },
      p(x, a, w) { for (let i = 0; i < w; i++) set(X(x) + i, a, '='); },
      b(x, a, str) { for (let i = 0; i < str.length; i++) { set(X(x) + i, a, str[i]); if (str[i] === '?') out.popN[(X(x) + i) + ',' + row(a)] = shardN++; } },
      spk(a0, a1, a) { for (let x = a0; x <= a1; x++) set(X(x), a, '^'); },

<script>
'use strict';
/* Starlight Queen — wonders (things worth stopping for) and the tear in the afternoon */
const WONDERS = [
  { id: 'fox', where: 'Finland', name: 'The Fox Fires', line: 'A fox runs over the fells, and its tail strikes sparks from the snow.' },
  { id: 'frogs', where: 'Sweden', name: 'Små grodorna', line: 'Adults, hopping like frogs round a pole. Nobody is embarrassed.' },
  { id: 'undersky', where: 'Kiruna', name: 'The Under-Sky', line: 'Ore in the roof of the mine, catching her light.' },
  { id: 'whale', where: 'the sea', name: 'A Whale', line: 'It looks at her with one eye, and finds nothing to object to.' },
  { id: 'arch', where: 'America', name: 'The Window', line: 'Water did this, and frost, and time.' },
  { id: 'kings', where: 'the Mesa', name: 'The Stone Kings', line: 'Each with a hand held out. Whoever carved them had met a king.' },
  { id: 'cross', where: 'Australia', name: 'The Southern Cross', line: 'Stars she has never seen. Nothing bad has come of it.' }
];
const WONDER_BY_ID = {}; WONDERS.forEach((q, i) => { q.n = i; WONDER_BY_ID[q.id] = q; });

const WONDER_RANGE = { fox: 64, frogs: 76, undersky: 150, whale: 96, arch: 76, kings: 230, cross: 120 };
const DANCERS = ['#3a6ab0', '#f0d040', '#f4f4f4', '#d84a3a', '#58b848', '#e88ab0', '#f4f4f4', '#3a6ab0'].map((col, i) => ({ tunic: col, tunicD: mix(col, '#101028', 0.28), belt: '#ffffff', cloak: null, hair: ['#e8c868', '#8a5a30', '#c88a48', '#f0dc98'][i % 4], hairD: ['#c8a040', '#6a4020', '#a06a30', '#d0b870'][i % 4], skin: '#f6d4b4', leg: '#3a3048', boot: '#5a3b28', band: '#4ea848', hem: i % 2 ? -5 : -7, long: i % 2 }));
ENT.wonder = {
  lit: true,
  init(e) { e.def = WONDER_BY_ID[e.wonder]; e.cx = e.x; e.gy = e.y; e.w = 460; e.h = 140; e.x -= 230; e.y -= 140; e.seen = !!Game.wonders[e.def.id]; e.k = e.seen ? 1 : 0; e.t0 = 0; e.ph = -1; e.cool = 0; e.glow = 0; e.trail = []; },
  update(w, e) {

    if (e.seen && e.k < 1) e.k = Math.min(1, e.k + 0.012);

      else if (e.trail.length) e.trail.shift();
    } else if (id === 'frogs') {
      if (Math.abs(dx) < 150 && e.t0 % 46 === 0) w.parts.push({ x: e.cx + rand(-30, 30), y: e.gy - 26, vx: rand(-0.2, 0.2), vy: -0.35, life: 70, max: 70, draw(c, x, y, q) { Paint.note(c, x, y, Math.min(1, q.life / 20)); } });

    } else if (id === 'whale') {
      if (e.cool > 0) e.cool--;
      const tx = clamp(p.x + 112, e.cx - 200, e.cx + 250);
      if (e.ph < 0 && near && e.cool <= 0 && e.seen) { e.ph = 0; e.wx = tx; }
      if (e.ph >= 0) {
        e.ph += 1 / 520; e.wx = lerp(e.wx, tx, 0.03);
        const surf = e.gy + 21;
        if (e.ph > 0.2 && e.ph < 0.3) { if (e.ph - 1 / 520 <= 0.2) Sound.sfx('glide'); for (let i = 0; i < 2; i++) w.parts.push({ x: e.wx + 30 + rand(-1, 1), y: surf - 26, vx: rand(-0.5, 0.5), vy: rand(-3, -1.6), g: 0.09, life: rand(26, 44), max: 44, col: i ? '#eaf8ff' : '#ffffff', sz: 1.6 }); }
        if (e.ph >= 1) { e.ph = -1; e.cool = 500; for (let i = 0; i < 10; i++) w.parts.push({ x: e.wx - 60 + rand(-6, 6), y: surf, vx: rand(-1.2, 1.2), vy: rand(-2.4, -0.8), g: 0.12, life: 30, max: 30, col: '#eaf8ff', sz: 1.6 }); }
      }

  },
  fox(e) { // where the fox is on its run across the sky, or null while it rests

      v: 4, carat: this.carats(), n, clarity: cl, colour: 'DEFGHIJK'[ci], cut, got, total, seen, kept,
      score: n * 3 + (7 - ci) + seen + kept

  },
  finish() {
    const g = this.grade(); this.lastGrade = g;
    if (!this.best || g.score > this.best.score) { this.best = g; this.write('sq-best', g); }
    this.keepAll();
    this.write('sq-run', null); this.saved = null;
    Scenes.go('ending');
  }
};

const Scenes = (() => {
  const list = {};
  let cur = null, next = null, fade = 1, dir = -1;
  function go(name, arg) { if (next) return; next = { name, arg }; dir = 1; }
  function update() {
    if (dir === 1) { fade = Math.min(1, fade + 0.06); if (fade >= 1 && next) { cur = list[next.name]; const a = next.arg; next = null; dir = -1; cur.enter && cur.enter(a || {}); } }
    else if (fade > 0) fade = Math.max(0, fade - 0.05);
    if (cur) cur.update(dir === 1);
  }
  return { list, go, update, get cur() { return cur; }, get fade() { return fade; }, get busy() { return dir === 1; } };
})();

/* ---------- Title ---------- */
Scenes.list.title = {
  enter() {
    Game.loadSave(); this.t = 0; this.sel = 0;
    this.items = (Game.saved ? ['continue'] : []).concat(['new', 'vault']);
    // On a web page that is the whole game in one file, offer that file to keep: it plays on a laptop with no internet.
    // (Tested by whether the game's own code is inline, not by whether the page has any outside script: hosts add their own.)
    this.canSave = /^https?:$/.test(location.protocol) && !document.querySelector('script[src$="js/main.js"]') && !Input.touch;
    if (this.canSave) this.items.push('download');
    this.saveNote = ''; this.saveT = 0;
    Sound.music('title'); Sound.duck(false); Sound.setRate(1);
  },
  update(busy) {
    this.t++;
    if (busy) return;
    const n = this.items.length;
    if (Input.hit('up')) { this.sel = (this.sel + n - 1) % n; Sound.sfx('select'); }
    if (Input.hit('dn')) { this.sel = (this.sel + 1) % n; Sound.sfx('select'); }
    if (Input.hit('vault')) { Scenes.go('vault'); return; }
    // the way in that is not on the menu: T, or three taps on the little stone above the name
    if (Input.hit('tap') && Math.abs(Input.tapX - 192) < 16 && Math.abs(Input.tapY - 19) < 14) { this.knock = (this.knock || 0) + 1; if (this.knock < 3) return; }
    if (Input.hit('travel') || this.knock >= 3) { this.knock = 0; Sound.sfx('lantern'); Scenes.go('places'); return; }
    if (Input.hit('enter') && this.t > 20) {
      if (Input.hit('tap')) { const k = Math.round((Input.tapY - 122) / 13); if (k < 0 || k >= this.items.length || Math.abs(Input.tapX - 192) > 110) return; this.sel = k; }
      Sound.sfx('confirm');
      const it = this.items[this.sel];
      if (it === 'continue') { Game.resume(); Scenes.go('map'); }
      else if (it === 'vault') Scenes.go('vault');
      else if (it === 'download') {
        this.saveNote = 'Fetching the game…'; this.saveT = this.t;
        fetch('./index.html', { credentials: 'same-origin' }).then(r => r.text().then(html => {
          if (!r.ok || html.indexOf('window.__sq') < 0) throw new Error('not the game');
          const page = html.replace(/<link rel="(manifest|apple-touch-icon)"[^>]*>\n?/g, ''); // the file needs neither on a laptop
          const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([page], { type: 'text/html' })); a.download = 'Starlight Queen.html';
          document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 8000);
          this.saveNote = 'Saved as “Starlight Queen.html”. Double-click it to play, no internet needed.'; this.saveT = this.t;
        })).catch(() => { this.saveNote = 'That did not work just now. Try again with a connection.'; this.saveT = this.t; });
      }
      else { Game.write('sq-run', null); Game.newGame(); Scenes.go('intro'); }
    }
  },
  noBloom: true,
  draw(c) { Vista.draw(c, this.t, false, this.t * 0.06); },
  drawHi(u) {
    const t = this.t, a = clamp((t - 10) / 50, 0, 1), g = u.ctx, s = u.s;
    // lockup: a small cut stone, two lines of engraved gold in one tracking, a hairline, the subtitle
    if (a > 0.05) { g.save(); g.globalAlpha = a; g.scale(s, s); drawGemHi(g, 192, 19, 6, GEM_BY_ID.kohinoor, t); g.restore(); }
    u.text('STARLIGHT', 192, 49, 21, { metal: true, ls: 5.6, alpha: a, title: true });
